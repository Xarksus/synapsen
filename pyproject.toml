[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapsen"
version = "0.1.0"
description = "Homöostatischer Zustandskern für Agenten: benannte Botenstoffe mit Zerfall, Kopplung und Tagesrhythmus — simulierbar, prüfbar, nachvollziehbar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Thorsten P." }]
keywords = [
    "agent", "emotion", "homeostasis", "affective-computing",
    "companion", "mcp", "llm", "persona", "state",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []          # bewusst: nur Standardbibliothek

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
synapsen = "synapsen.cli:main"
synapsen-mcp = "synapsen.mcp_server:main"

[project.urls]
Homepage = "https://github.com/xarksus/synapsen"
Issues = "https://github.com/xarksus/synapsen/issues"

[tool.hatch.build.targets.wheel]
packages = ["synapsen"]

[tool.hatch.build.targets.sdist]
include = ["synapsen", "tests", "tools", "docs",
           "README.md", "CHANGELOG.md", "LICENSE", "flake.nix", "verify.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py310"
